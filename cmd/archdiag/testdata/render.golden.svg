middle" dominant-baseline="central">internal/api</text> </g><g id="n-example.com/shop/internal/db" class="node st-changed kind-local" hx-get="/node/example.com/shop/internal/db" hx-target="#details"><title>example.com/shop/internal/db</title><rect x="114.4" y="172.0" width="107.2" height="36.0" rx="6"></rect> <text x="168.0" y="190.0" text-anchor="middle" dominant-baseline="central">internal/db</text> </g><g id="n-example.com/shop/internal/legacy" class="node st-removed kind-local" hx-get="/node/example.com/shop/internal/legacy" hx-target="#details"><title>example.com/shop/internal/legacy</title><rect x="169.0" y="86.0" width="136.0" height="36.0" rx="6"></rect> <text x="237.0" y="104.0" text-anchor="middle" dominant-baseline="central">internal/legacy</text> </g></svg>